<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Signature Hotel & Spa — Sudharsan Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1e2433;--bg:#f4f6f9;--white:#fff;--blue:#2563eb}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink)}

/* NAV */
.topnav{position:fixed;top:0;left:0;right:0;background:#fff;padding:0 5vw;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.4rem;font-weight:700;text-decoration:none;color:#000}

/* HERO */
.proj-hero{margin-top:64px;padding:60px 5vw;background:#eef0f5}
.proj-hero-inner{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.proj-logo{width:120px;height:120px;border-radius:20px;object-fit:contain;background:#fff;padding:10px}
.proj-title{font-size:32px;font-weight:bold;margin-bottom:10px}
.proj-desc{font-size:14px;margin-bottom:20px}
.hero-img{width:100%;border-radius:12px}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:20px}
.gallery img{width:100%;border-radius:10px}
</style>
</head>

<body>

<!-- NAV -->
<nav class="topnav">
  <a class="nav-logo" href="#">S.</a>
  <a href="#">Back</a>
</nav>

<!-- HERO -->
<section class="proj-hero">
  <div class="proj-hero-inner">

    <!-- LEFT -->
    <div>
      <!-- LOGO IMAGE -->
      <img class="proj-logo" src="images/logo.png" alt="Logo">

      <h1 class="proj-title">Grand Signature Hotel & Spa</h1>

      <p class="proj-desc">
        A premium hotel branding and social media campaign project.
      </p>
    </div>

    <!-- RIGHT IMAGE -->
    <img class="hero-img" src="images/hero.jpg" alt="Hero">

  </div>
</section>

<!-- GALLERY -->
<section style="padding:40px 5vw">
  <h2>Gallery</h2>

  <div class="gallery">
    <img src="images/img1.jpg">
    <img src="images/img2.jpg">
    <img src="images/img3.jpg">
    <img src="images/img4.jpg">
  </div>
</section>

</body>
</html>
